name: Feature request
description: Suggest a focused improvement to Guild Feed Box Sync
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What workflow or limitation should be improved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe what the mod should do and how it should interact with vanilla Feed Boxes.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Note any workarounds or simpler alternatives you have tried.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This request keeps the existing vanilla Feed Box approach in mind.
          required: true
