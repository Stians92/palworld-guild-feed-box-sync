name: Bug report
description: Report reproducible incorrect behavior or a crash
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not disclose cross-guild transfers, item duplication or loss, remotely triggered crashes, or other exploitable behavior here. Follow SECURITY.md and report those privately.
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: List the smallest reliable sequence that causes the problem.
      placeholder: |
        1. Load a world with ...
        2. Place ...
        3. Wait ...
    validations:
      required: true
  - type: dropdown
    id: host_type
    attributes:
      label: World type
      options:
        - Single-player
        - Steam co-op host
        - Steam co-op guest
        - Windows dedicated server
    validations:
      required: true
  - type: input
    id: palworld_version
    attributes:
      label: Palworld version or revision
      placeholder: Revision 82182
    validations:
      required: true
  - type: input
    id: mod_version
    attributes:
      label: Guild Feed Box Sync version
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation
      options:
        - Steam Workshop
        - Local development deployment
        - Dedicated-server installation
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: Paste only relevant lines containing [GuildFeedBox]. Remove personal paths, addresses, identifiers, and unrelated mod output.
      render: text
  - type: textarea
    id: other_mods
    attributes:
      label: Other relevant mods
      description: List other mods that alter Feed Boxes, inventories, guilds, or UE4SS behavior.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I restarted Palworld after enabling or updating the mod.
          required: true
        - label: I searched existing issues for this problem.
          required: true
        - label: This report does not contain private vulnerability details.
          required: true
